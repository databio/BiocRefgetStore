# R CMD check for BiocRefgetStore.
#
# gtars is a GitHub-only, Rust-extension dependency (NOT on CRAN/Bioconductor)
# and is the hard `Imports` of this package (gtars >= 0.10.0, for the alias
# accessor `get_collection_metadata_by_alias`). Rather than compiling the Rust
# crate from the databio/gtars monorepo in CI (slow, fragile, disk-hungry), we
# install the PREBUILT R binary attached to the gtars-r-v0.10.0 GitHub release.
# Constraints of that binary:
#   * built under R 4.4 -> this job pins r-version 4.4, or the shared object
#     won't load.
#   * linux x86_64 only (matches ubuntu-latest).
#   * does NOT bundle its R deps (BiocGenerics/IRanges are Bioconductor;
#     data.table is CRAN) -> we install those first, P3M-backed
#     (use-public-rspm) to dodge the Bioconductor object-store (osn) timeouts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Live-remote tests hit a public RefgetStore over the network. They are
      # gated off by default; leaving this unset keeps them skipped in CI.
      BIOCREFGETSTORE_RUN_REMOTE: "false"
    steps:
      # The Bioconductor dependency tree (BSgenome/Rsamtools + the big
      # RNAseqData.* BAM data packages pulled in via Suggests) overruns the
      # default runner disk ("cannot create R_TempDir" / write errors). Reclaim
      # preinstalled toolchains we don't use for ~25 GB of headroom.
      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # MUST match the R version the gtars binary was built under (4.4),
          # or its shared object will not load.
          r-version: '4.4'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      # Install the gtars prebuilt binary from the gtars-r-v0.10.0 release. Its R
      # deps (data.table CRAN; BiocGenerics/IRanges Bioconductor) are not bundled,
      # so install them first via pak (P3M-backed) before loading gtars. We do NOT
      # use setup-r-dependencies here because it also resolves THIS package's
      # DESCRIPTION, which lists gtars (not on any repo) and would fail.
      - name: Install gtars 0.10.0 (prebuilt binary, attached to the gtars-r-v0.10.0 release)
        shell: bash
        run: |
          set -euo pipefail
          # gtars' own R deps (data.table CRAN; BiocGenerics/IRanges Bioconductor)
          # are not bundled in the binary; install them first (P3M-backed via pak).
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch)); pak::pkg_install(c("data.table", "bioc::BiocGenerics", "bioc::IRanges"))'
          # Download + install the prebuilt binary package. type="binary" is
          # macOS/Windows-only; on Linux install the built tarball directly with
          # R CMD INSTALL (it does not recompile a binary package). gtars uses
          # per-component release tags, so the 0.10.0 R binary is attached to the
          # gtars-r-v0.10.0 tag: .../download/gtars-r-v0.10.0/gtars_0.10.0_...
          curl -fsSL -o "$RUNNER_TEMP/gtars.tar.gz" \
            https://github.com/databio/gtars/releases/download/gtars-r-v0.10.0/gtars_0.10.0_R_x86_64-pc-linux-gnu.tar.gz
          R CMD INSTALL "$RUNNER_TEMP/gtars.tar.gz"
          Rscript -e 'library(gtars); cat("gtars", as.character(packageVersion("gtars")), "\n"); stopifnot("get_collection_metadata_by_alias" %in% getNamespaceExports("gtars"), "get_seqs_from_regions" %in% getNamespaceExports("gtars"), "stream_sequence" %in% getNamespaceExports("gtars"))'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # BiocRefgetStore is a thin gtars wrapper; its only real deps are gtars
          # (installed above) + GenomeInfoDb + Biostrings. The heavyweight Bioconductor comparison
          # stack (BSgenome/Rsamtools + their multi-GB dbSNP/BAM data Suggests:
          # SNPlocs.Hsapiens.dbSNP144.GRCh38, RNAseqData.*) is used ONLY by the
          # benchmark vignette, which is rendered by doc-hubs (docs.refgenie.org), not
          # here. So we DON'T build vignettes in the check (see args below) and
          # only install what the package + its tests actually use.
          dependencies: '"hard"'
          # Bust the cached dependency library: earlier runs cached an older
          # gtars, and restoring it clobbered the freshly installed binary installed in the
          # step above (-> "unsuitable version: gtars" at check). Bump when gtars
          # bumps.
          cache-version: 4
          extra-packages: |
            any::rcmdcheck
            any::testthat
            bioc::GenomeInfoDb
            bioc::Biostrings
            bioc::BSgenome
            bioc::BSgenomeForge
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Don't build/check the benchmark vignette here (it would pull the
          # heavyweight comparison stack). --as-cran is dropped too, so the
          # benchmark's lone \donttest example is not executed.
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--ignore-vignettes")'
