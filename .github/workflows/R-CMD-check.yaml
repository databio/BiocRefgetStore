# R CMD check for BiocRefgetStore.
#
# IMPORTANT — gtars is a GitHub-only, Rust-extension dependency:
#   * gtars is NOT on CRAN or Bioconductor. It is the hard `Imports` dependency
#     of this package and must be installed from GitHub (databio/gtars).
#   * gtars contains a Rust crate, so the runner needs a Rust toolchain (cargo)
#     available BEFORE gtars is compiled/installed. We install Rust via
#     dtolnay/rust-toolchain, then install gtars from GitHub via remotes, and
#     only THEN resolve the remaining (Bioconductor) dependencies.
#
# NOTE / TODO: gtars lives in a Rust monorepo whose R package (gtars-r) depends
# on sibling crates via relative paths. `remotes::install_github("databio/gtars")`
# targets the repo root and may NOT resolve those relative crate paths the way a
# full monorepo checkout does. If the gtars install step fails in CI for that
# reason, this check cannot run a full `R CMD check` yet. In that case, see the
# `subdir`/checkout fallback notes below and gate accordingly — do not silently
# skip the gtars install.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain is required to compile the gtars Rust extension.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      # Install gtars (Rust-extension, GitHub-only) from source BEFORE resolving
      # the rest of the dependency graph, so setup-r-dependencies sees it as
      # already available. If gtars-r needs the full monorepo (relative crate
      # paths), replace this with a manual checkout of databio/gtars + an
      # install.packages("<clone>/gtars-r", repos = NULL, type = "source") step.
      - name: Install gtars from GitHub
        run: |
          install.packages("remotes")
          remotes::install_github("databio/gtars", subdir = "gtars-r", upgrade = "never")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Bioconductor deps + check tooling. gtars is already installed above.
          extra-packages: |
            any::rcmdcheck
            bioc::GenomeInfoDb
            bioc::Biostrings
            bioc::GenomicRanges
            bioc::IRanges
            bioc::Rsamtools
            bioc::BSgenome
            bioc::rtracklayer
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
