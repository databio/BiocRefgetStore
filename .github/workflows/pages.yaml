# Build a standalone HTML docs site from the package vignettes and deploy it to
# GitHub Pages. This is NOT pkgdown — it knits each vignette with rmarkdown and
# writes a small landing page (see .github/render-site.R).
#
# The headline is vignettes/benchmark.Rmd, which runs the package's real
# benchmark harness (run_benchmarks) at knit time, so the deployed timings +
# plot reflect an actual CI execution. That harness needs gtars + the
# Bioconductor Suggests (Biostrings/BSgenome/rtracklayer/Rsamtools) + bench +
# ggplot2 installed before the render.
#
# gtars is installed from the PREBUILT R binary on the gtars v0.9.0 release
# (see R-CMD-check.yaml for the rationale); this avoids compiling the Rust crate
# in CI. The binary was built under R 4.4, so this job pins r-version 4.4.

on:
  push:
    branches: [main]
  workflow_dispatch:

name: pages

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      # The Bioconductor dependency tree (BSgenome/Rsamtools + the big
      # RNAseqData.* BAM data packages pulled in via Suggests) overruns the
      # default runner disk ("cannot create R_TempDir" / write errors). Reclaim
      # preinstalled toolchains we don't use for ~25 GB of headroom.
      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # MUST match the R version the gtars binary was built under (4.4),
          # or its shared object will not load.
          r-version: '4.4'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      # Install the gtars prebuilt binary from the v0.9.0 release. Its R deps
      # (data.table CRAN; BiocGenerics/IRanges Bioconductor) are not bundled, so
      # install them first via pak (P3M-backed) before loading gtars. We do NOT
      # use setup-r-dependencies here because it also resolves THIS package's
      # DESCRIPTION, which lists gtars (not on any repo) and would fail.
      - name: Install gtars 0.9.1 (prebuilt binary, attached to the gtars v0.9.0 release)
        shell: bash
        run: |
          set -euo pipefail
          # gtars' own R deps (data.table CRAN; BiocGenerics/IRanges Bioconductor)
          # are not bundled in the binary; install them first (P3M-backed via pak).
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch)); pak::pkg_install(c("data.table", "bioc::BiocGenerics", "bioc::IRanges"))'
          # Download + install the prebuilt binary package. type="binary" is
          # macOS/Windows-only; on Linux install the built tarball directly with
          # R CMD INSTALL (it does not recompile a binary package). NOTE: the 0.9.1
          # R binary is attached to the EXISTING v0.9.0 release tag (no separate
          # v0.9.1 tag was cut), so the path is .../download/v0.9.0/gtars_0.9.1_...
          curl -fsSL -o "$RUNNER_TEMP/gtars.tar.gz" \
            https://github.com/databio/gtars/releases/download/v0.9.0/gtars_0.9.1_R_x86_64-pc-linux-gnu.tar.gz
          R CMD INSTALL "$RUNNER_TEMP/gtars.tar.gz"
          Rscript -e 'library(gtars); cat("gtars", as.character(packageVersion("gtars")), "\n"); stopifnot("get_collection_metadata_by_alias" %in% getNamespaceExports("gtars"), "get_seqs_from_regions" %in% getNamespaceExports("gtars"))'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The benchmark vignette is PRE-COMPUTED (committed results table + plot,
          # see vignettes/benchmark.Rmd), so it is NOT executed at render time and
          # the heavyweight comparison stack (BSgenome/Rsamtools/rtracklayer/bench/
          # ggplot2 + their multi-GB data Suggests) is NOT needed here. We only
          # need the rendering toolchain plus the package's own light deps.
          dependencies: '"hard"'
          # Bust the cached dependency library: earlier runs cached gtars 0.9.0,
          # and restoring it clobbered the 0.9.1 binary installed in the step
          # above (-> "unsuitable version: gtars"). Bump when gtars bumps.
          cache-version: 3
          extra-packages: |
            any::rmarkdown
            any::knitr
            bioc::GenomeInfoDb
            bioc::Biostrings
          needs: vignettes

      # Install the package itself so system.file() resolves the bundled FASTA
      # and run_benchmarks() is available to the benchmark vignette.
      - name: Install BiocRefgetStore
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Render vignettes to site/
        run: Rscript .github/render-site.R

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
